# Static site on Cloudflare Workers: assets only, no Worker code.
# Deploy: npm run deploy, or push to main (Workers Builds runs npm run build:ci).
name = "transcriptor-rioplatense"
compatibility_date = "2026-09-01"
# Served only on the custom domain; the workers.dev URL is switched off.
workers_dev = false
preview_urls = false

[[routes]]
pattern = "rioplatense.onegoodman.studio"
custom_domain = true

[assets]
# Built by scripts/build.js; security headers and font caching are in dist/site/_headers.
directory = "./dist/site"
